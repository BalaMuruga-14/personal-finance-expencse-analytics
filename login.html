<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Finance Analytics</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">💰</div>

        <h1>Personal Finance</h1>

        <p class="subtitle">Expense Analytics System</p>

        <h2>Login</h2>

        <form id="loginForm">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                🔐 Login
            </button>

            <p id="errorMessage"></p>

        </form>

        <div class="demo-login">
            <p>Demo Login</p>
            <span>Username: admin</span>
            <span>Password: 1234</span>
        </div>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
